services:

  api:
    build: .
    container_name: devconnect-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy 


  db:
    image: postgres:18
    container_name: devconnect-db
    environment:
      POSTGRES_DB: devconnect_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: djtherock@99
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: